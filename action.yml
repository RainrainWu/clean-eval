name: clean-eval
description: Risk heat map, risk-scaled PR review, and review-rule/risk-model evaluation for clean-architecture codebases.
author: RainrainWu
branding:
  icon: shield
  color: orange

inputs:
  skill:
    description: "Which skill to run: risk-heat-map | pr-review | eval"
    required: true

  # --- Claude credentials (not needed for risk-heat-map unless use-claude: true): one of an API key, an OAuth token,
  # or keyless workload identity federation (the anthropic-federation-* inputs; the job needs `id-token: write`).
  # For Bedrock/Vertex, leave them all empty and set CLAUDE_CODE_USE_BEDROCK / CLAUDE_CODE_USE_VERTEX
  # (plus cloud credentials) in the step's env.
  anthropic-api-key:
    description: Anthropic API key
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token (alternative to anthropic-api-key)
    required: false
  anthropic-federation-rule-id:
    description: >-
      Keyless sign-in, instead of a key or token: the workload identity federation rule (fdrl_...) under which the
      job's GitHub OIDC token is traded for a short-lived credential. The job needs `id-token: write`.
    required: false
  anthropic-organization-id:
    description: With anthropic-federation-rule-id, the Anthropic organization's ID
    required: false
  anthropic-service-account-id:
    description: With anthropic-federation-rule-id, the service account (svac_...) to act as
    required: false
  anthropic-workspace-id:
    description: With anthropic-federation-rule-id, the workspace, when the rule covers more than one
    required: false
  github-token:
    description: Token for gh (read PRs, post reviews). Needs pull-requests:write to post.
    required: false
    default: ${{ github.token }}

  # --- pr-review
  pr:
    description: PR number to review (defaults to the triggering pull_request)
    required: false
    default: ${{ github.event.pull_request.number }}
  post:
    description: "pr-review: post the review on the PR (true|false). The action posts one review from the validated result; the agent never gets write access."
    required: false
    default: "true"
  fail-on:
    description: "pr-review: fail the step on never | request_changes | blocker"
    required: false
    default: never

  # --- eval
  since:
    description: "eval: period start YYYY-MM-DD (default: 90 days ago)"
    required: false
  until:
    description: "eval: period end YYYY-MM-DD (default: today)"
    required: false
  apply:
    description: "eval: let the agent edit .clean-eval/risk-model.json and .clean-eval/review-rules.md (true|false). An edit is kept only if it is well-formed, changes only tunable keys and doesn't lower AUC on replay. The action never commits; follow with a create-PR step."
    required: false
    default: "false"

  # --- risk-heat-map
  readme:
    description: "risk-heat-map: README path, relative to the repo root"
    required: false
    default: README.md
  diagram:
    description: "risk-heat-map: where the SVG treemap the README shows is written, relative to the repo root"
    required: false
    default: docs/risk-heatmap.svg
  use-claude:
    description: "risk-heat-map: let Claude level the four aspects of every module from a read-through (true), or keep the static scores, no API key (false)"
    required: false
    default: "false"

  # --- common
  working-directory:
    description: Repository root to operate on (must be a full-history checkout)
    required: false
    default: ${{ github.workspace }}
  model:
    description: Claude model override (e.g. claude-opus-5-5)
    required: false
  max-turns:
    description: Max agent turns
    required: false
    default: "60"
  claude-code-version:
    description: "@anthropic-ai/claude-code npm version to install if claude is not on PATH (pinned; bump deliberately)"
    required: false
    default: "2.1.328"
  extra-prompt:
    description: Extra instructions appended to the skill prompt
    required: false

outputs:
  output-dir:
    description: Directory containing report.md, result.json, claude.log, and the agent's context/ and agent/ folders
    value: ${{ steps.run.outputs.output-dir }}
  result:
    description: Path to result.json
    value: ${{ steps.run.outputs.result }}
  readme-changed:
    description: "risk-heat-map: whether the README section and diagram changed (true|false)"
    value: ${{ steps.run.outputs.readme-changed }}
  verdict:
    description: "pr-review: approve | comment | request_changes — derived from validated findings (any blocker → request_changes)"
    value: ${{ steps.run.outputs.verdict }}
  max-tier:
    description: "pr-review: most severe risk band touched, from the heat map of the PR's base (Low | Moderate | High | Critical)"
    value: ${{ steps.run.outputs.max-tier }}
  blockers:
    description: "pr-review: number of blocker findings"
    value: ${{ steps.run.outputs.blockers }}
  auc:
    description: "eval: AUC of risk score vs escaped defects"
    value: ${{ steps.run.outputs.auc }}

runs:
  using: composite
  steps:
    # clean-eval's own environment, from its lockfile (hash-checked), outside every checkout. uv runs in the action's
    # folder with --no-config, so nothing in the repository under review can change what is installed.
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.13.7"
        enable-cache: false
    - id: env
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/clean-eval-venv
      run: |
        uv sync --frozen --no-config --no-dev
        echo "python=$UV_PROJECT_ENVIRONMENT/bin/python" >> "$GITHUB_OUTPUT"
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # The inputs reach the command as CE_* variables, never interpolated into this script, so no input can inject
      # shell code; clean_eval's `action` command reads them (`clean_eval action --help`).
      env:
        CE_PYTHON: ${{ steps.env.outputs.python }}
        CE_SKILL: ${{ inputs.skill }}
        CE_WORKSPACE: ${{ inputs.working-directory }}
        CE_OUTPUT_DIR: ${{ runner.temp }}/clean-eval
        CE_PR: ${{ inputs.pr }}
        CE_POST: ${{ inputs.post }}
        CE_FAIL_ON: ${{ inputs.fail-on }}
        CE_SINCE: ${{ inputs.since }}
        CE_UNTIL: ${{ inputs.until }}
        CE_APPLY: ${{ inputs.apply }}
        CE_README: ${{ inputs.readme }}
        CE_DIAGRAM: ${{ inputs.diagram }}
        CE_USE_CLAUDE: ${{ inputs.use-claude }}
        CE_MODEL: ${{ inputs.model }}
        CE_MAX_TURNS: ${{ inputs.max-turns }}
        CE_CLAUDE_VERSION: ${{ inputs.claude-code-version }}
        CE_EXTRA_PROMPT: ${{ inputs.extra-prompt }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key || env.ANTHROPIC_API_KEY }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token || env.CLAUDE_CODE_OAUTH_TOKEN }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic-federation-rule-id || env.ANTHROPIC_FEDERATION_RULE_ID }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic-organization-id || env.ANTHROPIC_ORGANIZATION_ID }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic-service-account-id || env.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic-workspace-id || env.ANTHROPIC_WORKSPACE_ID }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: '"$CE_PYTHON" -I "$GITHUB_ACTION_PATH/clean_eval" action'

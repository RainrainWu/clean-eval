<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one treemap (area = lines of code, fill = severity band) beside a detail panel; tabs switch the aspect. */
:root {
  --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #6f6d67;
  --grid: #e1e0d9; --base: #c3c2b7; --ring: rgba(11,11,11,.10); --sel: #0b0b0b; --tint: .34;
  /*__BAND_VARS__*/
  --on-good: #ffffff; --on-warn: #0b0b0b; --on-serious: #ffffff; --on-crit: #ffffff;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e97;
    --grid: #2c2c2a; --base: #383835; --ring: rgba(255,255,255,.10); --sel: #f0efec; --tint: .46; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e97;
  --grid: #2c2c2a; --base: #383835; --ring: rgba(255,255,255,.10); --sel: #f0efec; --tint: .46; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45;
  padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 26px; line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--ink2); }
.mono { font-family: var(--mono); }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--grid); border-radius: 8px; }
.tabs button, .tbtn { font: inherit; color: var(--ink2); background: transparent; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--ring); }
.tbtn { border: 1px solid var(--base); color: var(--ink); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.hint { margin: 0; color: var(--ink2); max-width: 90ch; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--ink2); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-weight: 600; font-size: 12px; white-space: nowrap; }
.chip.low { background: var(--good); color: var(--on-good); }
.chip.moderate { background: var(--warn); color: var(--on-warn); }
.chip.high { background: var(--serious); color: var(--on-serious); }
.chip.critical { background: var(--crit); color: var(--on-crit); }
.chip.na { background: var(--grid); color: var(--ink2); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.mapbox { min-width: 0; background: var(--surface); border-radius: 10px; box-shadow: 0 0 0 1px var(--ring); padding: 6px; }
.map { position: relative; width: 100%; }
.tile { position: absolute; margin: 0; padding: 8px 9px; border: 0; border-radius: 4px; text-align: left; font: inherit; cursor: pointer;
  display: flex; flex-direction: column; gap: 2px; overflow: hidden; transition: background-color .2s; color: var(--ink); }
.tile.low { background: rgba(var(--good-rgb),var(--tint)); box-shadow: inset 0 0 0 2px var(--good); }
.tile.moderate { background: rgba(var(--warn-rgb),var(--tint)); box-shadow: inset 0 0 0 2px var(--warn); }
.tile.high { background: rgba(var(--serious-rgb),var(--tint)); box-shadow: inset 0 0 0 2px var(--serious); }
.tile.critical { background: rgba(var(--crit-rgb),var(--tint)); box-shadow: inset 0 0 0 2px var(--crit); }
.tile.na { background: rgba(137,135,129,.16); box-shadow: inset 0 0 0 2px var(--base); }
.tile[aria-pressed="true"] { outline: 3px solid var(--sel); outline-offset: -3px; }
.tile:focus-visible { outline: 3px solid var(--sel); outline-offset: -3px; }
.tile .nm { font-weight: 650; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; }
.tile .mt { font-size: 12px; opacity: .92; font-variant-numeric: tabular-nums; }
.tile.sm .mt, .tile.xs .nm, .tile.xs .mt { display: none; }
.tile.xs { padding: 0; }
.detail { background: var(--surface); border-radius: 10px; box-shadow: 0 0 0 1px var(--ring); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.detail h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; }
.detail .path { color: var(--muted); font-size: 12px; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score b { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rows { display: flex; flex-direction: column; gap: 9px; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.track { height: 8px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; border-radius: 4px; }
.fill.low { background: var(--good); } .fill.moderate { background: var(--warn); } .fill.high { background: var(--serious); } .fill.critical { background: var(--crit); } .fill.na { background: var(--grid); }
.val { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 74px; text-align: right; white-space: nowrap; }
details { border-top: 1px solid var(--grid); padding-top: 8px; }
summary { cursor: pointer; font-weight: 600; font-size: 13px; }
details ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink2); font-size: 13px; }
details li + li { margin-top: 3px; }
.files { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink2); display: flex; flex-direction: column; gap: 3px; }
.files li { display: flex; justify-content: space-between; gap: 8px; }
.files span:first-child { overflow-wrap: anywhere; font-family: var(--mono); }
.kv { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink2); font-size: 13px; }
.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; white-space: normal; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; }
th button { font: inherit; font-weight: 600; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; }
td .chip { margin-left: 6px; }
.foot { margin: 0; color: var(--muted); font-size: 12px; max-width: 110ch; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 7px 10px; font-size: 12px; max-width: 280px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.tip b { display: block; font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 920px) { .grid { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>
<main class="wrap">
  <header>
    <h1 id="ttl"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="bar">
    <div class="tabs" role="tablist" id="tabs" aria-label="Risk aspect"></div>
    <button class="tbtn" id="tblbtn" type="button" aria-pressed="false">Table view</button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="legend" id="legend"></div>
  <div class="grid">
    <section class="mapbox" aria-label="Module treemap">
      <div class="map" id="map"></div>
      <div class="tblwrap" id="tbl" hidden></div>
    </section>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </div>
  <p class="foot" id="foot"></p>
</main>
<div class="tip" id="tip" hidden></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  function levelHint(a) {
    return 'Four levels, most severe first: ' + [0, 1, 2, 3].map(function (i) { return i + ' ' + a.levels[i]; }).join('; ') + '. Static signals place the score inside the level.'
      + (a.key === 'unverified' ? ' Build manifests, infrastructure manifests and test code are N/A.' : '');
  }
  var A = D.aspects;
  var VIEWS = [{ id: 'overall', label: 'Overall', key: 'overall', hint: 'Half is impact (the larger of ' + A[0].label + ' and ' + A[1].label + ') weighed against weakness (' + A[2].label + ' and ' + A[3].label + '); half is the worst single aspect, so one outstanding score lifts the whole module.' }]
    .concat(A.map(function (a) { return { id: a.id, label: a.label, key: a.key, hint: levelHint(a) }; }));
  var BANDS = D.bands.map(function (b, i) { return { max: b.max, id: b.label.toLowerCase(), label: b.label, glyph: b.glyph, range: (i ? D.bands[i - 1].max + 1 : 0) + '\u2013' + b.max }; });
  var mods = D.modules.slice().sort(function (a, b) { return b.loc - a.loc; });
  var total = mods.reduce(function (s, m) { return s + m.loc; }, 0) || 1;
  var view = VIEWS[0], sel = null, rects = [], tblSort = { key: 'loc', dir: -1 }, tableOn = false;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var BAND_NA = { id: 'na', label: 'N/A', glyph: '–' };
  function band(v) { if (v == null) return BAND_NA; for (var i = 0; i < BANDS.length; i++) if (v <= BANDS[i].max) return BANDS[i]; return BANDS[3]; }
  function num(v) { return v == null ? 'N/A' : v; }
  function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n); }
  function chip(v) { var b = band(v); return '<span class="chip ' + b.id + '"><span aria-hidden="true">' + b.glyph + '</span>' + b.label + '</span>'; }

  $('ttl').textContent = D.repo + ' risk heat map';
  $('sub').innerHTML = '<span class="mono">' + esc(D.ref) + ' @ ' + esc(D.sha) + '</span> · ' + fmt(D.loc_total) + ' lines of code · ' + mods.length + ' modules · ' + esc(D.generated_at);
  $('legend').innerHTML = BANDS.map(function (b) { return '<span class="chip ' + b.id + '"><span aria-hidden="true">' + b.glyph + '</span>' + b.label + ' ' + b.range + '</span>'; }).join('') + (mods.some(function (m) { return m.scores.unverified == null; }) ? '<span class="chip na"><span aria-hidden="true">–</span>N/A not rated</span>' : '') + '<span>Tile area = lines of code (tests excluded)</span>';

  $('tabs').innerHTML = VIEWS.map(function (v) { return '<button role="tab" type="button" data-v="' + v.id + '">' + v.label + '</button>'; }).join('');
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { location.hash = b.dataset.v; } });

  var clamped = 0;
  function layout() {
    var map = $('map'); var w = map.parentElement.clientWidth - 12;
    if (w < 50) return;
    var h = w < 620 ? Math.max(440, w * 1.15) : Math.max(380, Math.min(720, w * 0.62));
    map.style.height = h + 'px'; map.style.width = w + 'px';
    var min = total * 0.015; clamped = 0;
    var items = mods.map(function (m) { var v = Math.max(m.loc, min); if (m.loc < min) clamped++; return { d: m, v: v }; });
    var sum = items.reduce(function (s, i) { return s + i.v; }, 0);
    items.forEach(function (i) { i.a = i.v / sum * w * h; });
    rects = squarify(items, 0, 0, w, h);
    paint();
  }
  function squarify(items, x, y, w, h) {
    var out = [], rest = items.slice();
    function worst(row, side) {
      var s = row.reduce(function (a, b) { return a + b.a; }, 0);
      var mx = Math.max.apply(null, row.map(function (r) { return r.a; })), mn = Math.min.apply(null, row.map(function (r) { return r.a; }));
      return Math.max(side * side * mx / (s * s), s * s / (side * side * mn));
    }
    while (rest.length) {
      var side = Math.min(w, h), row = [rest[0]], i = 1;
      while (i < rest.length) { var nx = row.concat(rest[i]); if (worst(nx, side) <= worst(row, side)) { row = nx; i++; } else break; }
      var s = row.reduce(function (a, b) { return a + b.a; }, 0);
      if (w >= h) { var cw = s / h, cy = y; row.forEach(function (r) { var rh = r.a / cw; out.push({ d: r.d, x: x, y: cy, w: cw, h: rh }); cy += rh; }); x += cw; w -= cw; }
      else { var rh2 = s / w, cx = x; row.forEach(function (r) { var rw = r.a / rh2; out.push({ d: r.d, x: cx, y: y, w: rw, h: rh2 }); cx += rw; }); y += rh2; h -= rh2; }
      rest = rest.slice(row.length);
    }
    return out;
  }
  function paint() {
    var map = $('map');
    map.innerHTML = rects.map(function (r, idx) {
      var v = r.d.scores[view.key], b = band(v);
      var cls = 'tile ' + b.id + (r.w < 92 || r.h < 48 ? ' xs' : (r.h < 74 || r.w < 120 ? ' sm' : ''));
      var label = r.d.name + ', ' + fmt(r.d.loc) + ' lines, ' + view.label + ' ' + num(v) + ' ' + b.label;
      return '<button type="button" class="' + cls + '" data-i="' + idx + '" aria-pressed="' + (sel === r.d.name) + '" aria-label="' + esc(label) + '" style="left:' + (r.x + 1).toFixed(1) + 'px;top:' + (r.y + 1).toFixed(1) + 'px;width:' + Math.max(r.w - 2, 1).toFixed(1) + 'px;height:' + Math.max(r.h - 2, 1).toFixed(1) + 'px">'
        + '<span class="nm">' + esc(r.d.name.split('/').slice(-2).join('/')) + '</span><span class="mt"><span aria-hidden="true">' + b.glyph + '</span> ' + num(v) + ' · ' + fmt(r.d.loc) + '</span></button>';
    }).join('');
  }
  var tip = $('tip');
  $('map').addEventListener('click', function (e) { var t = e.target.closest('.tile'); if (t) select(rects[+t.dataset.i].d.name); });
  $('map').addEventListener('pointermove', function (e) {
    var t = e.target.closest('.tile');
    if (!t) { tip.hidden = true; return; }
    var m = rects[+t.dataset.i].d, v = m.scores[view.key], b = band(v);
    tip.innerHTML = '<b>' + esc(m.name) + '</b>' + b.glyph + ' ' + view.label + ' ' + num(v) + ' (' + b.label + ') · ' + fmt(m.loc) + ' lines · ' + Math.round(m.loc / total * 100) + '% of code';
    tip.hidden = false;
    var x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  });
  $('map').addEventListener('pointerleave', function () { tip.hidden = true; });

  function select(name) { sel = name; paint(); detail(); if (tableOn) table(); }
  function detail() {
    var m = mods.filter(function (x) { return x.name === sel; })[0];
    var el = $('detail');
    if (!m) { el.innerHTML = '<p class="hint">Select a module to see why it is rated this way.</p>'; return; }
    var s = m.scores;
    var rows = VIEWS.slice(1).map(function (v) { var b = band(s[v.key]); return '<div class="row"><span>' + v.label + '</span><span class="track"><span class="fill ' + b.id + '" style="display:block;width:' + (s[v.key] || 0) + '%"></span></span><span class="val">' + b.glyph + ' ' + num(s[v.key]) + ' ' + b.label + '</span></div>'; }).join('');
    var rated = [s.entropy, s.unverified].filter(function (x) { return x != null; });
    var impact = Math.max(s.biz, s.effects), weak = Math.round(rated.reduce(function (a, b) { return a + b; }, 0) / rated.length);
    var worst = Math.max.apply(null, [s.biz, s.effects, s.entropy, s.unverified].filter(function (x) { return x != null; }));
    var geo = Math.round(Math.sqrt(impact * weak));
    var why = VIEWS.slice(1).map(function (v) { return '<details><summary>' + v.label + '</summary><ul>' + (m.evidence[v.key] || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></details>'; }).join('');
    var sc = m.tests.scales || {}, scales = Object.keys(sc).length ? 'test files: ' + Object.keys(sc).map(function (k) { return k + ' ' + sc[k]; }).join(', ') : 'no linked test files';
    el.innerHTML = '<div><h2 class="mono">' + esc(m.name) + '</h2><div class="path">' + fmt(m.loc) + ' lines · ' + m.files + ' files</div></div>'
      + '<div class="score"><b>' + s.overall + '</b>' + chip(s.overall) + '<span class="path">overall</span></div>'
      + '<div class="path">Half of ' + geo + ' (impact ' + impact + ' × weakness ' + weak + ', geometric mean) plus half of ' + worst + ' (worst single aspect).</div>'
      + '<div class="rows">' + rows + '</div>' + why
      + '<div class="kv"><span>' + m.tests.tested + ' of ' + m.tests.functions + ' functions linked to tests</span><span>' + fmt(m.tests.loc) + ' linked test lines</span><span>' + esc(scales) + '</span></div>'
      + '<details open><summary>Largest files</summary><ul class="files">' + m.top_files.map(function (f) { return '<li><span>' + esc(f.path) + '</span><span>' + fmt(f.loc) + (f.max_fn ? ' · fn ' + f.max_fn : '') + '</span></li>'; }).join('') + '</ul></details>';
  }
  function table() {
    var cols = [['name', 'Module'], ['loc', 'Lines'], ['overall', 'Overall']].concat(VIEWS.slice(1).map(function (v) { return [v.key, v.label]; }));
    var val = function (m, k) { return k === 'name' ? m.name : k === 'loc' ? m.loc : (m.scores[k] == null ? -1 : m.scores[k]); };
    var rows = mods.slice().sort(function (a, b) { var x = val(a, tblSort.key), y = val(b, tblSort.key); return (x < y ? -1 : x > y ? 1 : 0) * tblSort.dir; });
    $('tbl').innerHTML = '<table><thead><tr>' + cols.map(function (c) { return '<th><button type="button" data-k="' + c[0] + '">' + c[1] + (tblSort.key === c[0] ? (tblSort.dir > 0 ? ' ↑' : ' ↓') : '') + '</button></th>'; }).join('') + '</tr></thead><tbody>'
      + rows.map(function (m) { return '<tr data-n="' + esc(m.name) + '"' + (m.name === sel ? ' style="background:var(--grid)"' : '') + '><td>' + esc(m.name) + '</td><td>' + fmt(m.loc) + '</td>' + ['overall', 'biz', 'effects', 'entropy', 'unverified'].map(function (k) { var b = band(m.scores[k]); return '<td>' + num(m.scores[k]) + '<span class="chip ' + b.id + '"><span aria-hidden="true">' + b.glyph + '</span>' + b.label + '</span></td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
  }
  $('tbl').addEventListener('click', function (e) {
    var b = e.target.closest('th button'); if (b) { var k = b.dataset.k; tblSort = { key: k, dir: tblSort.key === k ? -tblSort.dir : (k === 'name' ? 1 : -1) }; table(); return; }
    var r = e.target.closest('tr[data-n]'); if (r) select(r.dataset.n);
  });
  $('tblbtn').addEventListener('click', function () {
    tableOn = !tableOn; $('tblbtn').setAttribute('aria-pressed', String(tableOn));
    $('map').hidden = tableOn; $('tbl').hidden = !tableOn; if (tableOn) table(); else layout();
  });

  function route() {
    var id = (location.hash || '').slice(1);
    view = VIEWS.filter(function (v) { return v.id === id; })[0] || VIEWS[0];
    Array.prototype.forEach.call($('tabs').children, function (b) { b.setAttribute('aria-selected', String(b.dataset.v === view.id)); });
    $('hint').textContent = view.hint;
    paint();
  }
  window.addEventListener('hashchange', route);
  var notes = (D.notes || []).slice();
  if (D.judged_modules) notes.push('The four aspect levels come from a read-through of ' + D.judged_modules + ' modules');
  $('foot').textContent = 'Scores are 0–100 heuristics from static analysis of this snapshot, not a verdict. ' + notes.join('. ') + '.';
  sel = mods.slice().sort(function (a, b) { return b.scores.overall - a.scores.overall; })[0].name;
  route(); layout(); detail();
  if (window.ResizeObserver) new ResizeObserver(function () { if (!tableOn) layout(); }).observe($('map').parentElement);
  else window.addEventListener('resize', function () { if (!tableOn) layout(); });
  $('foot').textContent += clamped ? ' Tiles under 1.5% of the code are enlarged to stay readable.' : '';
})();
</script>

# Review every PR with clean-eval, depth scaled by module risk.
# Keyless: Claude signs in by workload identity federation, under a rule for this repository's PR runs (subject
# `repo:OWNER/REPO:pull_request`; README "Keyless credentials"). The IDs aren't secret: keep them in repository
# variables. To use an API key instead, drop `id-token: write` and the three anthropic-*-id inputs, and uncomment
# anthropic-api-key.
name: clean-eval PR review
on:
  pull_request:            # not pull_request_target: never expose secrets to fork code
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write          # lets the job request its OIDC token, which the action trades for a Claude credential

concurrency:
  group: clean-eval-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork and Dependabot PRs get no secrets and no OIDC token, so skip them instead of failing on missing credentials.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # risk scoring needs full history
          persist-credentials: false  # keep the token out of .git/config
      - id: review
        uses: RainrainWu/clean-eval@v1
        with:
          skill: pr-review
          anthropic-federation-rule-id: ${{ vars.ANTHROPIC_PR_FEDERATION_RULE_ID }}
          anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          post: "true"
          fail-on: blocker     # never | request_changes | blocker
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-eval-review
          path: ${{ steps.review.outputs.output-dir }}

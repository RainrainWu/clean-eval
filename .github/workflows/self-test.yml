# Dogfood: test the scripts, and run this repo's action on its own PRs (`uses: ./` runs the PR's own action code,
# so this is a smoke test, not an independent review).
name: self-test
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  risk-heat-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: heatmap
        uses: ./
        with:
          skill: risk-heat-map
      - name: Check outputs
        env:
          RESULT: ${{ steps.heatmap.outputs.result }}
          README_CHANGED: ${{ steps.heatmap.outputs.readme-changed }}
        run: |
          test -s "$RESULT"
          echo "readme-changed=$README_CHANGED"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d['modules']), 'modules')" "$RESULT"

  pr-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY secret not set — skipping pr-review self-test"
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: env.HAS_KEY == 'true'
        id: review
        uses: ./
        with:
          skill: pr-review
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: always() && env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clean-eval-review
          path: ${{ steps.review.outputs.output-dir }}

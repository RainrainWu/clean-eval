[project]
name = "clean-eval"
version = "1.0.0"
description = "Flexible, scalable, and explainable verification framework for agentic development to follow clean architecture best practices."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "click>=8.5,<9",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-lazy-fixtures>=1.4.1",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[tool.ruff]
line-length = 120  # the codebase's width; Black's 88 would rewrap nearly every line

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F), isort's import order (I), pytest's idioms (PT: plain asserts, pytest.raises,
# fixtures, parametrize), no relative imports (TID252, the rule tests/test_architecture.py enforces, caught as you
# type), and annotations on every function of the package (ANN; ty checks them)
select = ["E", "W", "F", "I", "PT", "TID252", "ANN"]
ignore = ["E501"]  # line length is the formatter's job, as with Black

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # ty still checks the tests against the annotated package
".github/**" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["clean_eval", "tests"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]  # a deprecation fails the suite instead of scrolling past
xfail_strict = true
markers = ["e2e: runs the command line or the GitHub Action end to end in subprocesses (the slow tests: -m 'not e2e' skips them)"]

[tool.ty.src]
include = ["clean_eval", "tests", ".github/scripts"]  # the type check: `uv run ty check`, run by CI's lint job

[tool.ty.terminal]
error-on-warning = true  # a warning fails CI too
